# Aplicação
spring.application.name=Muttley
server.port=8083
spring.config.import=optional:file:./application-local.properties
server.error.include-message=always
spring.thymeleaf.cache=false

# Banco: senha no arquivo local ou em SPRING_DATASOURCE_PASSWORD
spring.datasource.url=jdbc:mariadb://localhost:3307/muttley
spring.datasource.username=muttley
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect_resolvers=com.fatec.muttley.config.DialetoBancoResolver

# Integrações
app.frontend.url=http://localhost:5173
pdf.ms-url=http://localhost:8084
qrcode.ms-url=http://localhost:8086
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.auto-offset-reset=earliest

# Segurança
muttley.jwt.secret=${JWT_SECRET:muttley-local-development-secret-with-at-least-32-bytes}
hashids.secret=Muttley@Id#Secret

# Swagger: caminhos padrão /v3/api-docs e /swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
