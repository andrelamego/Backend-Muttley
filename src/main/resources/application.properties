spring.application.name=Muttley
spring.datasource.url=jdbc:mariadb://localhost:3306/muttley
spring.datasource.username=root

server.error.include-message=always

# Driver e dialeto detectados pela URL e pelos metadados do servidor.
spring.jpa.properties.hibernate.dialect_resolvers=com.fatec.muttley.config.DialetoBancoResolver
spring.jpa.show-sql=false
spring.mvc.hiddenmethod.filter.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.thymeleaf.cache=false

server.port=8083

app.frontend.url=http://localhost:5173

muttley.jwt.secret=${JWT_SECRET:muttley-local-development-secret-with-at-least-32-bytes}
muttley.jwt.expiration=2h

hashids.secret=Muttley@Id#Secret

pdf.ms-url=http://localhost:8084
qrcode.ms-url=http://localhost:8086

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=muttley-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.fatec.muttley.email,com.fatec.muttley.qrcode
