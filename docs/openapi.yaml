components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Insira o token JWT retornado no endpoint /api/auth/login.

  schemas:
    SolicitacaoCadastro:
      type: object
      required: [nome, email]
      properties:
        nome:
          type: string
        email:
          type: string
          format: email

    LoginRequest:
      type: object
      required:
        - email
        - senha
      properties:
        email:
          type: string
          format: email
          example: usuario@fatec.sp.gov.br
        senha:
          type: string
          example: Senha@1234

    UsuarioResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nome:
          type: string
          example: João da Silva
        email:
          type: string
          example: joao@fatec.sp.gov.br
        role:
          type: string
          enum: [USER, ADMIN]
          example: USER

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          example: 7200
        usuario:
          $ref: '#/components/schemas/UsuarioResponse'

    AtualizacaoPessoa:
      type: object
      required: [nome, email, telefone, cpf, senha]
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
          example: Maria Souza
        email:
          type: string
          format: email
          example: maria@fatec.sp.gov.br
        cpf:
          type: string
          example: '529.982.247-25'
        telefone:
          type: string
          example: '11999999999'
        senha:
          type: string
          example: SenhaForte@123

    PessoaMeResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        email:
          type: string
        role:
          type: string
        aluno:
          type: boolean
        professor:
          type: boolean
        palestrante:
          type: boolean
        organizador:
          type: boolean
        colaborador:
          type: boolean

    CertificadoUsuarioResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        codigoValidacao:
          type: string
        dataEmissao:
          type: string
          format: date
        eventoTema:
          type: string
        eventoData:
          type: string
          format: date

    MedalhaUsuarioResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        tipo:
          type: string
        eventoTema:
          type: string

    ParticipacaoUsuarioResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        inscricao:
          type: string
        tipo:
          type: string
        presente:
          type: boolean
        eventoId:
          type: integer
          format: int64
        eventoTema:
          type: string
        eventoData:
          type: string
          format: date

    EventoPublicoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        tema:
          type: string
        descricao:
          type: string
        data:
          type: string
          format: date
        horarioInicio:
          type: string
        horarioFim:
          type: string
        inscricoesEncerradas:
          type: boolean

    InscricaoPublicaRequest:
      type: object
      required:
        - nome
        - email
        - cpf
      properties:
        nome:
          type: string
          example: Carlos Silva
        email:
          type: string
          format: email
          example: carlos@fatec.sp.gov.br
        cpf:
          type: string
          example: '52998224725'

    EventoComParticipacaoDTO:
      type: object
      required:
        - evento
      properties:
        evento:
          $ref: '#/components/schemas/AtualizacaoEvento'
        participacoes:
          type: array
          items:
            type: object

    AtualizacaoEvento:
      type: object
      required:
        - tema
        - data
        - horarioInicio
        - horarioFim
      properties:
        id:
          type: integer
          format: int64
        tema:
          type: string
          example: Semana de Tecnologia FATEC
        descricao:
          type: string
        data:
          type: string
          format: date
          example: '2026-10-15'
        horarioInicio:
          type: string
          example: '09:00'
        horarioFim:
          type: string
          example: '12:00'
        localId:
          type: integer
          format: int64
        disciplinaId:
          type: integer
          format: int64

    AtualizacaoParticipacao:
      type: object
      required:
        - pessoaId
        - eventoId
      properties:
        id:
          type: integer
          format: int64
        inscricao:
          type: string
        tipo:
          type: string
          example: ALUNO
        pessoaId:
          type: integer
          format: int64
        eventoId:
          type: integer
          format: int64

    AtualizacaoDisciplina:
      type: object
      required:
        - nome
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
          example: Banco de Dados Relacional
        sigla:
          type: string
          example: BDR

    AtualizacaoEndereco:
      type: object
      required:
        - logradouro
      properties:
        id:
          type: integer
          format: int64
        logradouro:
          type: string
          example: Av. Águia de Haia
        numero:
          type: string
          example: '2633'
        bairro:
          type: string
          example: Cidade A.E. Carvalho
        cidade:
          type: string
          example: São Paulo
        estado:
          type: string
          example: SP
        cep:
          type: string
          example: '03694000'

    AtualizacaoLocal:
      type: object
      required:
        - nome
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
          example: Auditório Principal
        capacidade:
          type: integer
          example: 200
        enderecoId:
          type: integer
          format: int64

    AtualizacaoMedalha:
      type: object
      required:
        - nome
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
          example: Participação Ouro
        descricao:
          type: string
        caminhoImagem:
          type: string

    AtualizacaoPatrocinador:
      type: object
      required:
        - nome
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
          example: Google Cloud
        caminhoLogo:
          type: string

    RegisterInfo:
      type: object
      properties:
        nome:
          type: string
        email:
          type: string
        cpf:
          type: string
